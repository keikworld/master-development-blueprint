# render.yaml — Render Blueprint (Infrastructure as Code)
# Copy to your project root and customize.
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: my-app-name
    env: node
    region: ohio
    plan: free
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
